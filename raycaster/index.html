<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Raycasting Engine</title>
    <style>
        body {
            margin: 0;
            background: #1a1a1a;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }
        .header {
            margin: 10px;
            text-align: center;
        }
        .container {
            display: flex;
            gap: 10px;
            background: #333;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas {
            background: #000;
            image-rendering: pixelated;
        }
        .controls {
            margin-top: 15px;
            font-size: 0.9em;
            color: #aaa;
        }
        kbd {
            background: #555;
            padding: 2px 5px;
            border-radius: 3px;
            color: #fff;
        }
        /* 增加一个错误提示样式 */
        #js-error-msg {
            background: #ff4444;
            color: white;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            display: none; /* 默认隐藏 */
        }
    </style>
</head>
<body>

    <div id="js-error-msg">⚠️ 引擎核心文件 (raycaster.js) 加载失败，请检查文件名和路径。</div>

    <div class="header">
        <h2>JS Raycasting Engine</h2>
        <p>基于原生 JavaScript 的伪 3D 渲染引擎</p>
    </div>

    <div class="container">
        <canvas id="mapCanvas" width="300" height="300"></canvas>
        <canvas id="viewCanvas" width="400" height="300"></canvas>
    </div>

    <div class="controls">
        控制：<kbd>W</kbd> <kbd>S</kbd> 移动，<kbd>A</kbd> <kbd>D</kbd> 旋转
    </div>

    <script>
        // 在尝试加载外部 JS 之前，先设个定时器
        // 如果 2 秒后 raycaster.js 还没给回应，就显示错误
        window.jsLoaded = false;
        setTimeout(() => {
            if (!window.jsLoaded) {
                document.getElementById('js-error-msg').style.display = 'block';
            }
        }, 2000);
    </script>
    <script src="raycaster.js"></script>
</body>
</html>
